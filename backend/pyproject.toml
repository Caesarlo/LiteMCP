[project]
name = "litemcp"
version = "0.1.0"
description = "LiteMCP — MCP gateway and service marketplace backend"
readme = "README.md"
license = "MIT"
authors = [
    { name = "GUMP", email = "350960338@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiomysql>=0.2",
    "redis>=5.1",
    "httpx>=0.27",
    "cryptography>=43.0",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "docker>=7.1",
    "mcp>=1.1",
    "jsonschema>=4.23",
    "bcrypt>=5.0.0",
    "pyjwt[crypto]>=2.13.0",
]

[project.scripts]
litemcp = "litemcp:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "aiosqlite>=0.22.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff.lint.per-file-ignores]
# Nested async context managers in the contract test are intentional: combining
# them would change cleanup semantics if the inner __aenter__ fails.
"tests/db/test_session.py" = ["SIM117"]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"
