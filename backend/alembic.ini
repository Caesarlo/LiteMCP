# LiteMCP backend Alembic configuration (M1-DB-003).
#
# Migration scripts live in `migrations/` relative to this file. The default
# `sqlalchemy.url` is a development placeholder only: the migration contract
# suite (tests/db/test_migrations.py) overrides the main option per run, and
# M1-MODEL-* features append real entity migrations on top of the bootstrap
# root under `migrations/versions/`.

[alembic]
# Path to the migration scripts, relative to this file.
script_location = migrations

# sys.path prepend so `import litemcp` works when running the alembic CLI from
# the backend/ directory. pytest already adds `src` via pyproject pythonpath;
# `%(here)s/src` makes this an absolute path independent of the current working
# directory. `path_separator = os` avoids the legacy space/comma/colon split,
# which would otherwise split a Windows drive letter (e.g. `E:`).
prepend_sys_path = %(here)s/src
path_separator = os

# Database URL consumed by env.py. Development default only; the migration
# contract tests override this main option before running `upgrade head`.
sqlalchemy.url = postgresql+asyncpg://litemcp:litemcp@localhost:5433/litemcp

# Logging configuration, consumed by env.py via logging.config.fileConfig.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
